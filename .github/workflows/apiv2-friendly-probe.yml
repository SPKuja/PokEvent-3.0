name: APIv2 Friendly Probe

on:
  push:
    branches:
      - feature/play-pokemon-ingestion
    paths:
      - "scripts/probe_apiv2_friendlies.py"
      - ".github/workflows/apiv2-friendly-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/probe_apiv2_friendlies.py
