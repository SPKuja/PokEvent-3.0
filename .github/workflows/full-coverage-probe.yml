name: Full Coverage Probe

on:
  push:
    branches:
      - feature/play-pokemon-ingestion
    paths:
      - "scripts/probe_full_coverage.py"
      - ".github/workflows/full-coverage-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/probe_full_coverage.py
