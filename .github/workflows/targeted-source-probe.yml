name: Targeted Source Probe

on:
  push:
    branches:
      - feature/play-pokemon-ingestion
    paths:
      - "scripts/probe_targeted_api.py"
      - ".github/workflows/targeted-source-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swindon-challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e .

      - name: Probe targeted Swindon challenge feed
        run: python scripts/probe_targeted_api.py
