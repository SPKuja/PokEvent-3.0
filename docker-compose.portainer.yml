x-pokevent-environment: &pokevent-environment
  POKEVENT_DISCORD_TOKEN: ${POKEVENT_DISCORD_TOKEN}
  POKEVENT_PUBLIC_BASE_URL: ${POKEVENT_PUBLIC_BASE_URL:-http://localhost:8080}
  POKEVENT_ENABLE_MEMBER_WELCOMES: ${POKEVENT_ENABLE_MEMBER_WELCOMES:-true}
  POKEVENT_LEAGUES: '${POKEVENT_LEAGUES:-{"2012924":"Pokémon League Swindon","5683200":"Bath TCG","6234115":"Firestorm Games Swindon","6244670":"Crazy Collectables","6238080":"Atomic Cards"}}'
  POKEVENT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pokevent}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pokevent}

x-pokevent-app: &pokevent-app
  image: ghcr.io/spkuja/pokevent-3.0:latest
  pull_policy: always
  environment:
    <<: *pokevent-environment

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pokevent}
      POSTGRES_USER: ${POSTGRES_USER:-pokevent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Portainer}
    volumes:
      - pokevent-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-pokevent} -d ${POSTGRES_DB:-pokevent}
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    <<: *pokevent-app
    command: alembic upgrade head
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *pokevent-app
    container_name: pokevent-web
    command: pokevent-web
    restart: unless-stopped
    ports:
      - "${POKEVENT_WEB_PORT:-8080}:8080"
    networks:
      default:
      NeuralNet:
        aliases:
          - pokevent-web
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully

  bot:
    <<: *pokevent-app
    command: pokevent-bot
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *pokevent-app
    command: pokevent-worker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pokevent-postgres:

networks:
  NeuralNet:
    external: true
