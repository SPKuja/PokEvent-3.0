services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pokevent}
      POSTGRES_USER: ${POSTGRES_USER:-pokevent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pokevent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pokevent} -d ${POSTGRES_DB:-pokevent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    command: alembic upgrade head
    restart: "no"
    env_file:
      - .env
    environment:
      POKEVENT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pokevent}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pokevent}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    command: pokevent-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POKEVENT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pokevent}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pokevent}
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  bot:
    build: .
    command: pokevent-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POKEVENT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pokevent}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pokevent}
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: pokevent-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POKEVENT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pokevent}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pokevent}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pokevent-postgres:
